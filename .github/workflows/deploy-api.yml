name: Deploy API to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Nest over SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if printf '%s' "$SSH_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/vps
          else
            printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/vps
          fi
          chmod 600 ~/.ssh/vps
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vps -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/stroycrm
          git fetch origin main
          git reset --hard origin/main
          cd backend
          systemctl stop stroycrm-api || true
          npm ci --include=dev
          npm run build
          test -f dist/main.js
          cp /opt/stroycrm/deploy/stroycrm-api.service /etc/systemd/system/stroycrm-api.service
          systemctl daemon-reload
          systemctl start stroycrm-api
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3001/api/health; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "API did not become healthy on :3001"
            systemctl status stroycrm-api --no-pager || true
            journalctl -u stroycrm-api -n 80 --no-pager || true
            exit 1
          fi
          REMOTE
